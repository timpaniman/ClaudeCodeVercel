> **작성일**: 2026-05-26 | **담당**: 장동인 교수 | **버전**: v1.0 | **방법론**: bkit PDCA (Dynamic Level)

---

## 1. 배경 및 문제 정의

### 현황
- AI 코딩 교육 과정: 연 2회 × 10주, 현재 17기 진행 중
- 졸업생 규모: 약 500명 (1기 ~ 16기 졸업 + 17기 재학)
- 현재 커뮤니케이션: 단톡방 (KakaoTalk 그룹)
- 현재 자료 공유: 구글 드라이브

### 문제점

| 문제 | 영향 |
|------|------|
| 단톡방 알림 피로 | 중요 공지 누락, 참여도 저하 |
| 구글 드라이브 분산 | 자료 탐색 어려움, 버전 관리 불가 |
| 기수 간 교류 없음 | 네트워킹 기회 손실 |
| 모바일 최적화 없음 | CEO 특성상 이동 중 접근 불편 |
| AI 학습 지원 없음 | 질문/답변 지연, 학습 연속성 단절 |

---

## 2. 목표

**핵심 목표**: 500명 AI4CEO 졸업생이 지속적으로 연결되고 학습할 수 있는 모바일 우선 커뮤니티 플랫폼 구축

### 성공 지표 (KPI)

| 지표 | 목표 |
|------|------|
| 월간 활성 사용자(MAU) | 졸업생의 40% 이상 |
| 자료 접근 시간 | 구글 드라이브 대비 50% 단축 |
| AI 질문 응답 시간 | 24시간 → 즉시 응답 |
| 모바일 사용 비율 | 60% 이상 |

## 3. 사용자 정의

| 역할 | 설명 | 주요 니즈 |
|------|------|-----------|
| 재학생 (현 기수) | 현재 교육 중인 CEO | 강의 자료, 질문, 과제 제출 |
| 졸업생 | 1기~16기 수료자 | 네트워킹, 최신 자료, AI 도우미 |
| 교수/운영진 | 장동인 교수 + 스태프 | 공지, 자료 업로드, 기수 관리 |
| 신규 입학 예정자 | 랜딩 페이지 대상 | 과정 소개, 졸업생 성과 확인 |

## 4. 핵심 기능 (11개)

### F1. 인증 시스템
- 이메일/소셜 로그인 (Supabase Auth)
- 기수별 가입 승인 (Admin 검토)
- 역할 기반 접근 제어 (RBAC): 재학생 / 졸업생 / 운영진

### F2. 커뮤니티 피드
- 게시글 작성 (텍스트, 이미지, 링크)
- 댓글 / 답글 / 좋아요
- 기수별 채널 + 전체 채널, 공지사항 고정
- 실시간 업데이트 (Supabase Realtime)

### F3. 자료 라이브러리
- 기수별 강의 자료 (PDF, 영상 링크, 코드)
- 카테고리 분류, 검색, Supabase Storage, 졸업생 아카이브

### F4. AI 학습 도우미
- LangChain + Claude opus 4.7 기반 Q&A
- 강의 자료 RAG, 코딩 질문 채팅, 대화 히스토리, 기수별 컨텍스트

### F5. 기수 관리
- 기수 프로필 (1기~n기), 멤버 디렉토리, 진도 현황, 졸업 인증서

### F6. 사용자 프로필
- CEO 프로필 (회사, 직책, 기수), 포트폴리오 링크, 활동 히스토리

### F7. 알림 시스템
- 이메일 + 인앱 알림, 알림 설정 개인화

### F8. 관리자 패널
- 사용자 관리, 기수 생성/관리, 콘텐츠 모더레이션, 통계 대시보드

### F9. AI 프로젝트 쇼케이스 ✨
- CEO가 만든 앱/서비스/자동화 공개 전시
- GitHub 링크, 데모 URL, 스크린샷, 카테고리(챗봇/RAG/자동화/분석) 필터
- 좋아요·댓글·스크랩, 프로필 포트폴리오 자동 연동

### F10. 비즈니스 임팩트 스토리 ✨
- AI 도입 실제 성과 등록 (업무 단축률, 비용 절감, 매출 증가)
- 수치 기반 임팩트 카드 UI (예: "월 40시간 절감")
- 산업별·기수별 필터, Claude 자동 요약·태그 생성

### F11. 교수 직통 질문함 (Ask the Professor) ✨
- AI가 못 답하는 전문 판단 질문 전용 채널
- 회원 +1 투표 → 교수 우선 답변 큐 정렬
- 질문 상태: 대기중 / 검토중 / 답변완료
- 답변 후 RAG 지식베이스 자동 등록
